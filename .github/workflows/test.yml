name: StudyForge checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check server.mjs
      - run: node --check public/app.mjs
      - run: node --test
      - name: Build deployment image
        run: docker build -t studyforge:ci .
